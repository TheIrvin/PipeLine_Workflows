name: pipeline_workflows

services:
  ollama:
    image: ollama/ollama:latest
    container_name: pipeline-ollama
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  narration-model-init:
    image: ollama/ollama:latest
    container_name: pipeline-narration-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      NARRATION_MODEL: ${NARRATION_MODEL:-qwen3:4b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$$NARRATION_MODEL\""]
    restart: "no"

  idea-bank-api:
    build:
      context: .
      dockerfile: services/idea_bank/Dockerfile
    container_name: pipeline-idea-bank
    restart: unless-stopped
    depends_on:
      narration-model-init:
        condition: service_completed_successfully
    environment:
      IDEA_DB_PATH: /app/data/ideas/ideas.db
      OLLAMA_URL: http://ollama:11434
      NARRATION_MODEL: ${NARRATION_MODEL:-qwen3:4b}
      IDEA_API_PORT: "8090"
      IDEA_MIN_PENDING: ${IDEA_MIN_PENDING:-30}
      IDEA_BATCH_SIZE: ${IDEA_BATCH_SIZE:-30}
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:${IDEA_API_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  subtitle-worker:
    build:
      context: .
      dockerfile: services/production/Subtitle.Dockerfile
    container_name: pipeline-subtitle-worker
    restart: unless-stopped
    environment:
      SUBTITLE_APP_DATA_DIR: /app/data/subtitle-worker
      HF_HOME: /app/data/models/huggingface
      XDG_CACHE_HOME: /app/data/models/cache
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  qwen-tts-worker:
    build:
      context: .
      dockerfile: services/production/QwenTTS.Dockerfile
    container_name: pipeline-qwen-tts
    restart: unless-stopped
    environment:
      HF_HOME: /app/data/models/qwen3-tts-huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTHONUNBUFFERED: "1"
      QWEN_TTS_MODEL: ${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-Base}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  production-worker:
    build:
      context: .
      dockerfile: services/production/Dockerfile
    container_name: pipeline-production-worker
    restart: unless-stopped
    depends_on:
      idea-bank-api:
        condition: service_healthy
      subtitle-worker:
        condition: service_healthy
      qwen-tts-worker:
        condition: service_healthy
    environment:
      IDEA_DB_PATH: /app/data/ideas/ideas.db
      PIPELINE_DATA_PATH: /app/data
      PIPELINE_API_PORT: "8091"
      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-manual-inbox}
      MANUAL_MEDIA_ROOT: /app/manual-media
      CONTENT_BUFFER_MIN: ${CONTENT_BUFFER_MIN:-7}
      CONTENT_BUFFER_TARGET: ${CONTENT_BUFFER_TARGET:-14}
      TTS_PROVIDER: ${TTS_PROVIDER:-qwen3-tts-local}
      QWEN_TTS_URL: http://qwen-tts-worker:8092
      QWEN_TTS_MODEL: ${QWEN_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-Base}
      QWEN_TTS_REFERENCE_AUDIO: /app/data/models/voice-reference/Audio_Ejemplo.mp3
      QWEN_TTS_REFERENCE_TEXT_FILE: /app/data/models/voice-reference/Audio_Ejemplo.txt
      FISH_AUDIO_API_KEY: ${FISH_AUDIO_API_KEY:-}
      FISH_AUDIO_REFERENCE_ID: ${FISH_AUDIO_REFERENCE_ID:-1f7fb4bc1697479aab869ff685bfa644}
      FISH_AUDIO_MODEL: ${FISH_AUDIO_MODEL:-s2.1-pro-free}
      TTS_VOICE: ${TTS_VOICE:-es-la}
      TTS_SPEED: ${TTS_SPEED:-170}
      SUBTITLE_WORKER_URL: http://subtitle-worker:8000
      SUBTITLE_EXPORT_DIR: /app/data/subtitle-worker/exports
    volumes:
      - ./data:/app/data
      - ${MEDIA_INBOX_HOST_PATH:-./data/assets}:/app/manual-media
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    container_name: pipeline-n8n
    restart: unless-stopped
    depends_on:
      idea-bank-api:
        condition: service_healthy
      production-worker:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      TZ: ${TZ:-America/Guayaquil}
      GENERIC_TIMEZONE: ${TZ:-America/Guayaquil}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/opt/pipeline-workflows:ro
    init: true

volumes:
  n8n_data:
    name: pipeline_workflows_n8n_data

